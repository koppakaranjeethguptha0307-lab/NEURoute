services:
  - type: web
    name: neuroute-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neuroute-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_DATA_MODE
        value: "false"

  - type: web
    name: neuroute-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DEMO_MODE
        value: "false"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: neuroute-backend
          property: url

databases:
  - name: neuroute-db
    databaseName: neuroute
    user: neuroute_user
    plan: free
